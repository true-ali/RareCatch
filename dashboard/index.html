 <div class="grid">${[{label:'تراکنش بررسی‌شده',value:fa(s.i),note:'از '+fa(D.rows.length)+' تراکنش بازپخش',color:'#e6edf3'},{label:'هشدار صادرشده',value:fa(tp+fp),note:'قانون یا مدل',color:A},{label:'تقلب شناسایی‌شده',value:fa(tp),note:tp+fn?'از '+fa(tp+fn)+' تقلب تاکنون':'هنوز تقلبی ندیده‌ایم',color:T},{label:'تقلب از دست رفته',value:fa(fn),note:'نه مدل و نه قوانین نگرفتند',color:R}].map(kpi).join('')}</div>

 <div class="card" style="flex:2;min-width:380px"><b style="font-size:16px">جریان تراکنش‌های امتیازدهی‌شده</b><div class="muted">هر ردیف را بزنید تا جزئیات را ببینید. «برچسب واقعی» پس از تصمیم مدل نمایش داده می‌شود.</div>${feed||'<div class="muted" style="padding:30px;text-align:center;font-size:14px">برای شروع «پخش» را بزنید.</div>'}</div>
 <div style="flex:1;min-width:280px;display:flex;flex-direction:column;gap:16px"><div class="card"><b style="font-size:16px">جزئیات تراکنش</b><div style="font-size:13px;line-height:1.9;color:#c4cfdd;margin-top:8px">${detail}</div></div>
 <div class="card"><b style="font-size:16px">سیاست سرویس</b><div style="font-size:13px;line-height:1.9;color:#c4cfdd;margin-top:8px">هشدار اگر <b>یکی از چهار قانون</b> فعال شود <b>یا</b> امتیاز مدل از آستانه‌ی ${fa(D.thr,2)} بیشتر باشد. قوانین: V14، V17، V12، V10 در دنباله‌ی پایینی (۰٫۱٪) توزیع تراکنش‌های سالم آموزش.</div></div></div></div>`}
function thr(){
 const m=metrics(s.thr,s.rules),prec=m.alerts?m.tp/m.alerts:0,rec=m.tp/(m.tp+m.fn);let maxC=0;const g=[];
 for(let t=-6;t<=3.51;t+=.25){const c=metrics(t,s.rules).cost;g.push([t,c]);if(c>maxC)maxC=c}
 const X=t=>10+((t+6)/9.5)*780,Y=c=>200-c/maxC*185;
 return `<div class="card" style="display:flex;flex-direction:column;gap:14px"><b style="font-size:16px">آستانه را خودتان تغییر دهید</b>
 <div style="display:flex;flex-wrap:wrap;gap:16px;align-items:center"><label for="thr" style="font-size:14px">آستانه‌ی امتیاز مدل: <b>${fa(s.thr,1)}</b></label>
 <input dir="ltr" id="thr" type="range" min="-6" max="3.5" step="0.1" value="${s.thr}" style="flex:1;min-width:220px;accent-color:${T}">
 <button class="btn ${s.rules?'pri':''}" id="rules">قوانین: ${s.rules?'روشن':'خاموش'}</button><button class="btn" id="rthr">آستانه‌ی سرویس (${fa(D.thr,2)})</button></div>
 <div class="muted">معیارها روی کل مجموعه‌ی آزمون (۵۶٬۹۶۲ تراکنش، ۷۵ تقلب) محاسبه شده‌اند: تقلب‌ها دقیقاً همان ۷۵ مورد‌اند و هشدارهای اشتباه از شمارش دقیق همه‌ی ۵۶٬۸۸۷ تراکنش سالم می‌آیند. هزینه = ۱۰ برای هر هشدار اشتباه + مبلغ تقلب‌های از‌دست‌رفته.</div></div>
 <div class="grid">${[{label:'هشدار (برآورد کل آزمون)',value:fa(Math.round(m.alerts)),note:'از ۵۶٬۹۶۲ تراکنش',color:A},{label:'بازیابی (Recall)',value:fa(rec*100)+'٪',note:fa(m.tp)+' از ۷۵ تقلب',color:T},{label:'دقت (Precision)',value:fa(prec*100)+'٪',note:'سهم هشدارهای واقعی',color:S},{label:'تقلب از دست رفته',value:fa(m.fn),note:'در ۷۵ تقلب آزمون',color:R},{label:'هزینه‌ی کل (برآورد)',value:fa(Math.round(m.cost)),note:'مرجع سرویس: ۳٬۱۹۰',color:'#e6edf3'}].map(kpi).join('')}</div>
 <div class="card"><b style="font-size:16px">منحنی هزینه بر حسب آستانه</b><svg viewBox="0 0 800 220" style="width:100%"><polyline points="${g.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ')}" fill="none" stroke="${S}" stroke-width="2.5"/><line x1="${X(s.thr)}" x2="${X(s.thr)}" y1="10" y2="200" stroke="${T}" stroke-width="2"/><circle cx="${X(s.thr)}" cy="${Y(m.cost)}" r="6" fill="${T}"/></svg><div class="muted">محور افقی: آستانه از ۶- تا ۳٫۵ · محور عمودی: هزینه‌ی کل (برآورد). خط سبز = تنظیم فعلی.</div></div>`}
const bars=(rows)=>rows.map(x=>`<div style="display:flex;align-items:center;gap:10px;font-size:13px;margin-top:8px"><span style="width:140px;color:${x.c||'#c4cfdd'}">${x.n}</span><div class="bar"><div style="width:${x.w};background:${x.c||A}"></div></div><span style="width:64px;direction:ltr;text-align:left">${x.v}</span></div>`).join('');
function qual(){
 const mo=[['xgb_undersampled',.796,T],['random_forest',.818,S],['lgbm_undersampled',.794,S],['xgb_weighted',.771,S],['logreg',.749,S],['lgbm_weighted',.742,S]].map(x=>({n:`<span dir="ltr">${x[0]}</span>`,v:fa(x[1],3),w:x[1]*100+'%',c:x[2]}));
 const la=[['HTTP کامل p50',2.17,T],['HTTP کامل p95',2.55,T],['HTTP کامل p99',3.02,T],['درون‌فرایند p50',.99,S],['درون‌فرایند p95',1.23,S],['درون‌فرایند p99',1.40,S]].map(x=>({n:x[0],v:x[1].toFixed(2)+' ms',w:x[1]/3.2*100+'%',c:x[2]}));
 const ps=PSI.map(p=>({n:`<span dir="ltr">${p[0]}</span>`,v:p[1].toFixed(2),w:Math.min(100,p[1]/1.5*100)+'%',c:A}));
 return `<div style="display:flex;flex-wrap:wrap;gap:16px"><div class="card" style="flex:1;min-width:340px"><b style="font-size:16px">مدل‌ها (PR-AUC روی آزمون)</b>${bars(mo)}<div class="muted" style="margin-top:10px">مدل سرویس با بهترین PR-AUC اعتبارسنجی انتخاب شد (xgb_undersampled). جنگل تصادفی در آزمون کمی بالاتر است، اما فقط ۷۵ تقلب در آزمون هست و این اختلاف معنادار نیست.</div></div>
 <div class="card" style="flex:1;min-width:340px"><b style="font-size:16px">تأخیر سرویس (اندازه‌گیری‌شده)</b>${bars(la)}<div class="muted" style="margin-top:10px">۲۰۰۰ درخواست، تک‌رشته‌ای، روی لپ‌تاپ توسعه. نه بار تولید.</div></div></div>
 <div class="card"><b style="font-size:16px">رانش ورودی‌ها (PSI، آموزش در برابر آزمون)</b><div class="muted">آستانه‌ی ۰٫۲۵ = رانش قابل‌توجه. ویژگی «ساعت» به‌ناچار رانش دارد، چون بازه‌های زمانی جدا از هم‌اند.</div>${bars(ps)}</div>`}
function meth(){return `<div class="card" style="font-size:14px;line-height:2;color:#c4cfdd"><b style="font-size:18px;color:#e6edf3">روش</b><br>• داده: ۲۸۴٬۸۰۷ تراکنش، ۴۹۲ تقلب (۰٫۱۷۳٪). تقسیم زمانی ۶۰/۲۰/۲۰؛ آموزش ۳۶۰، اعتبارسنجی ۵۷ و آزمون ۷۵ تقلب دارد.<br>• مدل‌ها: رگرسیون لجستیک و جنگل تصادفی (پایه)، XGBoost و LightGBM با وزن کلاس و با کم‌نمونه‌گیری فقط روی آموزش.<br>• آستانه روی اعتبارسنجی انتخاب و روی آزمون اعمال شد. معیار اصلی PR-AUC است.<br>• سیاست سرویس (قوانین یا مدل): ۱۳۷ هشدار، ۵۸ از ۷۵ تقلب شناسایی‌شده، هزینه‌ی ۳٬۱۹۰ روی کل آزمون.<br><br><b style="font-size:18px;color:#e6edf3">محدودیت‌ها</b><br>• V1 تا V28 ناشناس‌اند (PCA)؛ دلیل هشدارها در سطح قانون است.<br>• نمایش زنده یک <b>بازپخش</b> از تراکنش‌های واقعی آزمون است، نه ترافیک زنده: ۷۵ تقلب + ۳۰۰ تراکنش سالم نمونه‌ی تصادفی (بذر ثابت). ترکیب بسیار پرتقلب‌تر از واقعیت است؛ تب «آستانه» از شمارش دقیق کل آزمون استفاده می‌کند.<br>• اعداد روی ۷۵ تقلب تکیه دارند؛ فاصله‌ی اطمینان محاسبه نشده. امتیاز API یک margin است، نه احتمال کالیبره‌شده.<br>• هزینه‌ی ۱۰ برای هشدار اشتباه فرض است.</div>`}
function draw(){
 const body=[live,thr,qual,meth][s.tab]();const names=['پایش زنده','آستانه و هزینه','کیفیت و رانش','روش و محدودیت‌ها'];
 document.getElementById('app').innerHTML=`<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px"><div><h1 style="margin:0;font-size:24px">تشخیص تقلب تراکنش · RareCatch</h1><div class="muted">داده‌ی واقعی کارت اعتباری (ULB/Worldline) · XGBoost + قوانین · تقسیم زمانی، فقط داده‌ی آزمون</div></div><div class="tabs">${names.map((n,k)=>`<button data-tab="${k}" class="${k===s.tab?'on':''}">${n}</button>`).join('')}</div></div>${body}`;
 const a=document.getElementById('app');
 a.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{s.tab=+b.dataset.tab;draw()});
 a.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>{s.sel=+b.dataset.sel;draw()});
 const on=(id,f)=>{const e=document.getElementById(id);if(e)e.onclick=()=>{f();draw()}};
 on('play',()=>{if(s.i>=D.rows.length)s.i=0;s.playing=!s.playing;schedule()});on('reset',()=>{s.i=0;s.sel=-1;s.playing=false;schedule()});
 on('fast',()=>{s.speed=Math.min(8,s.speed*2);schedule()});on('slow',()=>{s.speed=Math.max(.5,s.speed/2);schedule()});
 on('rules',()=>{s.rules=!s.rules});on('rthr',()=>{s.thr=D.thr;s.rules=true});
 const r=document.getElementById('thr');if(r)r.oninput=e=>{s.thr=parseFloat(e.target.value);draw();document.getElementById('thr').focus()};
}
draw();
</script></body></html>
